<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AiOSH – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a5e 40%, #0d2137 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Glowing orbs in background */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .orb1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, transparent 70%); top: -120px; left: -100px; }
    .orb2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(34,211,238,0.25) 0%, transparent 70%); bottom: -80px; right: 8%; }
    .orb3 { width: 250px; height: 250px; background: radial-gradient(circle, rgba(168,85,247,0.2) 0%, transparent 70%); top: 35%; left: 22%; }

    /* Main glassmorphism card */
    .canvas {
      display: flex;
      width: 100%;
      max-width: 460px;
      min-height: auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    /* ─── LEFT PANEL: Login Form ─── */
    .left-panel {
      flex: 1;
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Logo placeholder — replace src with your actual logo */
    .logo-wrap {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.25);
      border: 2px solid rgba(99, 102, 241, 0.6);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      overflow: hidden;
      align-self: center;
      position: relative;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .logo-initials { font-size: 22px; font-weight: 700; color: #a5b4fc; letter-spacing: 1px; }

    .title {
      font-size: 28px; font-weight: 700;
      color: #fff; letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 11.5px;
      color: rgba(165, 180, 252, 0.85);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.6;
      max-width: 260px;
    }

    .form-row { display: flex; gap: 12px; width: 100%; }
    .form-row .form-group { flex: 1; }

    .form-group { width: 100%; margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 10.5px; font-weight: 600;
      color: rgba(165, 180, 252, 0.85);
      margin-bottom: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .form-group input::placeholder { color: rgba(255, 255, 255, 0.28); }
    .form-group input:focus,
    .form-group select:focus {
      border-color: rgba(99, 102, 241, 0.7);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }
    .form-group select {
      background-image:
        linear-gradient(45deg, transparent 50%, #a5b4fc 50%),
        linear-gradient(135deg, #a5b4fc 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 3px),
        calc(100% - 12px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }
    .form-group select option {
      background: #1a1a5e;
      color: #fff;
    }

    /* ─── PASSWORD SHOW / HIDE (EYE) TOGGLE ─── */
    .password-wrap {
      position: relative;
    }
    .password-wrap input#inp-pass {
      padding-right: 44px;
    }
    .eye-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    .eye-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .eye-icon-slash {
      display: none;
    }
    .eye-btn.active {
      color: #a5b4fc;
    }
    .eye-btn.active .eye-icon-open {
      display: none;
    }
    .eye-btn.active .eye-icon-slash {
      display: inline-flex;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 18px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: transparent;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: rgba(99, 102, 241, 0.25);
      color: #dbeafe;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 18px;
    }

    .remember-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: rgba(255,255,255,0.6);
      cursor: pointer; user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #6366f1;
      cursor: pointer;
    }

    .forgot-btn {
      font-size: 12.5px; color: #a5b4fc;
      background: none; border: none;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: color 0.2s;
    }
    .forgot-btn:hover { color: #c7d2fe; text-decoration: underline; }

    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 14px;
      color: #fff; font-size: 14.5px; font-weight: 600;
      cursor: pointer; letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.2s, transform 0.15s;
      user-select: none;
    }
    .login-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .login-btn:active { transform: scale(0.98); }

    /* Success toast */
    .toast {
      display: none;
      margin-top: 14px;
      width: 100%;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 10px;
      padding: 11px 16px;
      color: #86efac;
      font-size: 13px;
      text-align: center;
    }

    /* Error message */
    .error-msg {
      display: none;
      margin-top: 14px;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 11px 16px;
      color: #fca5a5;
      font-size: 13px;
      text-align: center;
    }

    .pass-hint {
      font-size: 10.5px;
      color: rgba(165, 180, 252, 0.6);
      margin-top: 5px;
      line-height: 1.4;
    }
    /* Responsive */
      @media (max-width: 820px) {
        .canvas { flex-direction: column; max-width: 100%; }
        .left-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 28px 20px; }
      }

      @media (max-width: 680px) {
        .title { font-size: 22px; letter-spacing: 2px; }
        .subtitle { font-size: 10.5px; max-width: 240px; }
        .form-row { flex-direction: column; gap: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 9.5px; }
        .form-group input { font-size: 12px; padding: 9px 11px; }
        .pass-hint { font-size: 9.5px; }
        .options-row { gap: 10px; }
        .remember-label { font-size: 11.5px; }
        .forgot-btn { font-size: 11.5px; }
        .login-btn { padding: 12px; font-size: 13.5px; }
        .toast, .error-msg { font-size: 12px; padding: 10px 14px; }
      }

      @media (max-width: 480px) {
        body { padding: 16px; }
        .canvas { min-height: auto; }
        .left-panel { padding: 24px 16px; }
        .logo-wrap { width: 64px; height: 64px; margin-bottom: 10px; }
        .logo-initials { font-size: 18px; }
        .title { font-size: 18px; margin-bottom: 4px; }
        .subtitle { font-size: 10px; margin-bottom: 22px; max-width: 220px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { font-size: 9px; margin-bottom: 5px; }
        .form-group input { font-size: 11.5px; padding: 8px 10px; }
        .pass-hint { font-size: 9px; margin-top: 4px; }
        .options-row { flex-direction: column; align-items: flex-start; margin-bottom: 14px; gap: 8px; }
        .remember-label { font-size: 11px; }
        .forgot-btn { font-size: 11px; }
        .login-btn { padding: 11px; font-size: 13px; }
        .toast, .error-msg { font-size: 11.5px; padding: 9px 12px; }
      }

    /* ─── ACCESSIBILITY IMPROVEMENTS ─── */

    /* Skip to main content */
    .skip-link {
      position: fixed; top: -60px; left: 16px; z-index: 9999;
      background: #6366f1; color: #fff;
      padding: 12px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-decoration: none;
      transition: top 0.2s ease;
    }
    .skip-link:focus-visible { top: 12px; }

    /* Visible keyboard focus */
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #a5b4fc; outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- Background orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <main class="canvas" id="main-content">

    <!-- ── LEFT: Login Form ── -->
    <div class="left-panel">

      <div class="logo-wrap">
        <img src="images/logo.png" alt="AiTECH Logo" />
      </div>

      <div class="title">AiOSH</div>
      <div class="subtitle">Welcome to AiOSH, Antipolo Institute of Technology Learning Portal</div>

      <div class="mode-switch">
        <button class="mode-btn active" id="btn-signup" type="button">Create Account</button>
        <button class="mode-btn" id="btn-login" type="button">Log In</button>
      </div>

      <div class="form-row" id="name-year-row">
        <div class="form-group">
          <label for="inp-name">Name</label>
          <input type="text" id="inp-name" placeholder="Full name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="inp-year">Year Level</label>
          <select id="inp-year">
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
          </select>
        </div>
      </div>

      <!-- Student ID -->
      <div class="form-group">
        <label for="inp-id">Student Number</label>
        <input type="text" id="inp-id" placeholder="e.g. 2024-1234" autocomplete="username" />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="inp-pass">Password</label>
        <div class="password-wrap">
          <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="eye-btn" aria-label="Show password" title="Show password">
            <!-- Eye (open) — password hidden -->
            <svg class="eye-icon-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye with slash — password visible -->
            <svg class="eye-icon-slash" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <p class="pass-hint" id="pass-hint">Create a password with 6+ characters, 1 uppercase letter, and 1 symbol (e.g. . , ! @).</p>
      </div>

      <!-- Remember Me + Forgot Password -->
      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="remember" /> Remember Me
        </label>
        <button class="forgot-btn" onclick="handleForgotPassword()">Forgot Password?</button>
      </div>

      <!-- Account Action Button -->
      <button class="login-btn" id="submit-account-btn" onclick="handleAccountAction()">Create Account</button>

      <!-- Feedback messages -->
      <div class="toast" id="toast">✓ Login successful! Redirecting to your dashboard…</div>
      <div class="error-msg" id="error-msg">⚠ Please fill in all fields before signing in.</div>
    </div>

  </main>

  <script>
    let currentMode = 'signup';

    // ─── PASSWORD SHOW / HIDE TOGGLE ──────────────────────────
    const eyeBtn = document.getElementById('eye-btn');
    const passInput = document.getElementById('inp-pass');
    if (eyeBtn && passInput) {
      eyeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const show = passInput.type === 'password';
        passInput.type = show ? 'text' : 'password';
        eyeBtn.classList.toggle('active', show);
        eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        eyeBtn.setAttribute('title', show ? 'Hide password' : 'Show password');
        passInput.focus();
      });
    }

    const studentIdPattern = /^\d{4}-\d{4}$/;
    const uppercasePattern = /[A-Z]/;
    const symbolPattern = /[^A-Za-z0-9]/;

    function getYearCode(yearText) {
      const y = (yearText || '').toLowerCase();
      if (y.includes('2')) return '2';
      return '1';
    }

    function topicNameForYear(yearCode) {
      return yearCode === '2' ? 'RSW' : 'Scaffolding';
    }

    function getAccounts() {
      try {
        return JSON.parse(localStorage.getItem('aiosh_accounts') || '[]');
      } catch {
        return [];
      }
    }

    function saveAccounts(accounts) {
      localStorage.setItem('aiosh_accounts', JSON.stringify(accounts));
    }

    function showMessage(kind, text) {
      const toast = document.getElementById('toast');
      const errMsg = document.getElementById('error-msg');

      toast.style.display = 'none';
      errMsg.style.display = 'none';

      if (kind === 'success') {
        toast.textContent = text;
        toast.style.display = 'block';
      } else {
        errMsg.textContent = text;
        errMsg.style.display = 'block';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const signupBtn = document.getElementById('btn-signup');
      const loginBtn = document.getElementById('btn-login');
      const submitBtn = document.getElementById('submit-account-btn');
      const nameYearRow = document.getElementById('name-year-row');
      const passHint = document.getElementById('pass-hint');

      signupBtn.classList.toggle('active', mode === 'signup');
      loginBtn.classList.toggle('active', mode === 'login');

      nameYearRow.style.display = mode === 'signup' ? 'flex' : 'none';
      submitBtn.textContent = mode === 'signup' ? 'Create Account' : 'Log In';
      passHint.textContent = mode === 'signup'
        ? 'Create a password with 6+ characters, 1 uppercase letter, and 1 symbol (e.g. . , ! @).'
        : 'Enter the student number and password saved for this account.';
    }

    // ─── REMEMBER ME (localStorage) ───────────────────────────
    window.addEventListener('load', () => {
      const savedName = localStorage.getItem('aiosh_name');
      const savedYear = localStorage.getItem('aiosh_year');
      const savedId   = localStorage.getItem('aiosh_id');
      if (savedName) document.getElementById('inp-name').value = savedName;
      if (savedYear) document.getElementById('inp-year').value = savedYear;
      if (savedId) {
        document.getElementById('inp-id').value = savedId;
        document.getElementById('remember').checked = true;
      }

      setMode('signup');

      document.getElementById('btn-signup').addEventListener('click', () => setMode('signup'));
      document.getElementById('btn-login').addEventListener('click', () => setMode('login'));
    });

    // ─── ACCOUNT HANDLER ──────────────────────────────────────
    function handleAccountAction() {
      const name  = document.getElementById('inp-name').value.trim();
      const year  = document.getElementById('inp-year').value.trim();
      const id    = document.getElementById('inp-id').value.trim();
      const pass  = document.getElementById('inp-pass').value.trim();
      const rem   = document.getElementById('remember').checked;
      const toast = document.getElementById('toast');
      const errMsg = document.getElementById('error-msg');

      toast.style.display = 'none';
      errMsg.style.display = 'none';

      if (!id || !pass || (currentMode === 'signup' && (!name || !year))) {
        showMessage('error', 'Please fill in all required fields before continuing.');
        return;
      }

      if (!studentIdPattern.test(id)) {
        showMessage('error', 'Student number must follow the format YYYY-#### (example: 2024-1234).');
        return;
      }

      if (currentMode === 'signup') {
        if (pass.length < 6 || !uppercasePattern.test(pass) || !symbolPattern.test(pass)) {
          showMessage('error', 'Password must be 6+ characters, include 1 uppercase letter and 1 symbol.');
          return;
        }

        const accounts = getAccounts();
        const existing = accounts.find(account => account.id === id);

        if (existing) {
          showMessage('error', 'This student number already has an account. Please use Log In instead.');
          return;
        }

        const yearCode = getYearCode(year);
        accounts.push({
          id,
          password: pass,
          name,
          yearLevel: yearCode,
          topic: topicNameForYear(yearCode),
          createdAt: new Date().toISOString()
        });
        saveAccounts(accounts);

        sessionStorage.setItem('aiosh_session_name', name);
        sessionStorage.setItem('aiosh_session_year', yearCode);
        sessionStorage.setItem('aiosh_session_id', id);
        sessionStorage.setItem('aiosh_session_topic', topicNameForYear(yearCode));

        if (rem) {
          localStorage.setItem('aiosh_name', name);
          localStorage.setItem('aiosh_year', yearCode);
          localStorage.setItem('aiosh_id', id);
        } else {
          localStorage.removeItem('aiosh_name');
          localStorage.removeItem('aiosh_year');
          localStorage.removeItem('aiosh_id');
        }

        showMessage('success', 'Account created successfully! Redirecting to your dashboard…');
        setTimeout(() => { window.location.href = 'landing.html'; }, 1800);
        return;
      }

      const accounts = getAccounts();
      const account = accounts.find(item => item.id === id && item.password === pass);

      if (!account) {
        showMessage('error', 'Student number or password is incorrect. Please try again.');
        return;
      }

      const yearCode = account.yearLevel || getYearCode(account.yearLevel || '1st Year');

      sessionStorage.setItem('aiosh_session_name', account.name);
      sessionStorage.setItem('aiosh_session_year', yearCode);
      sessionStorage.setItem('aiosh_session_id', account.id);
      sessionStorage.setItem('aiosh_session_topic', account.topic || topicNameForYear(yearCode));

      if (rem) {
        localStorage.setItem('aiosh_name', account.name);
        localStorage.setItem('aiosh_year', yearCode);
        localStorage.setItem('aiosh_id', account.id);
      } else {
        localStorage.removeItem('aiosh_name');
        localStorage.removeItem('aiosh_year');
        localStorage.removeItem('aiosh_id');
      }

      showMessage('success', 'Welcome back! Redirecting to your dashboard…');
      setTimeout(() => { window.location.href = 'landing.html'; }, 1800);
    }

    // Allow pressing Enter to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAccountAction();
    });

    // ─── FORGOT PASSWORD ──────────────────────────────────────
    function handleForgotPassword() {
      window.location.href = 'forgotpassword.html';
    }
  
  </script>

</body>
</html>
