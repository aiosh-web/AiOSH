<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AiOSH – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a5e 40%, #0d2137 100%);
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }

    /* Background orbs */
    .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    .orb1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%); top: -150px; left: -150px; }
    .orb2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, transparent 70%); bottom: -100px; right: 5%; }
    .orb3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 70%); top: 40%; left: 30%; }

    /* ─── NAVIGATION BAR ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 68px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Logo + site name — left side */
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.25);
      border: 2px solid rgba(99, 102, 241, 0.6);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .nav-logo img { width: 100%; height: 100%; object-fit: cover; }
    .nav-logo-initials { font-size: 13px; font-weight: 700; color: #a5b4fc; letter-spacing: 0.5px; }

    .nav-site-name {
      font-size: 18px; font-weight: 700;
      color: #fff; letter-spacing: 2px;
    }

    /* Nav links — right side */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .nav-links a,
    .nav-links button {
      display: inline-flex; align-items: center;
      padding: 8px 16px;
      font-size: 13.5px; font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      background: none; border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      letter-spacing: 0.3px;
    }
    .nav-links a:hover,
    .nav-links button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .nav-links a.active {
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }

    /* Sign out button — distinct style */
    .signout-btn {
      color: rgba(252, 165, 165, 0.85) !important;
      border: 1px solid rgba(239, 68, 68, 0.25) !important;
    }
    .signout-btn:hover {
      background: rgba(239, 68, 68, 0.12) !important;
      color: #fca5a5 !important;
    }

    /* ─── PAGE CONTENT ─── */
    .page {
      position: relative;
      z-index: 1;
      padding-top: 68px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Welcome section */
    .welcome-section {
      padding: 60px 48px 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .welcome-tag {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 20px;
      padding: 4px 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .welcome-heading {
      font-size: 38px; font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .welcome-heading span {
      background: linear-gradient(135deg, #a5b4fc, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.6;
    }

    /* ─── BLANK CONTENT AREA ─── */
    .content-area {
      flex: 1;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Placeholder cards — to be filled later */
    /* ─── SECTION LABELS ─── */
    .section-label {
      font-size: 11px; font-weight: 600;
      color: rgba(165,180,252,0.5);
      letter-spacing: 1.2px; text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* ─── LANDSCAPE SLIDESHOW ─── */
    .slideshow-wrap {
      width: 100%; border-radius: 20px; overflow: hidden;
      position: relative; aspect-ratio: 16/7;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .ls-slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.9s ease;
      padding: 40px;
    }
    .ls-slide.active { opacity: 1; }
    .ls-slide-1 { background: linear-gradient(135deg, rgba(99,102,241,0.35), rgba(139,92,246,0.25)); }
    .ls-slide-2 { background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(99,102,241,0.3)); }
    .ls-slide-3 { background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(236,72,153,0.18)); }
    .ls-slide-4 { background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(34,211,238,0.2)); }

    /* Slide with photo */
    .ls-slide-photo { background-size: cover; background-position: center; }
    .ls-slide-photo .ls-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%);
    }

    .ls-icon  { font-size: 52px; margin-bottom: 14px; }
    .ls-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 10px; }
    .ls-desc  { font-size: 13.5px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.6; max-width: 460px; }

    .ls-photo-note {
      position: absolute; top: 14px; right: 14px;
      background: rgba(99,102,241,0.3); border: 1px solid rgba(99,102,241,0.5);
      border-radius: 8px; padding: 5px 11px;
      font-size: 10px; color: #a5b4fc; z-index: 5;
    }

    .ls-dots {
      position: absolute; bottom: 16px;
      display: flex; gap: 8px; z-index: 4;
    }
    .ls-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.3); cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .ls-dot.active { background: #a5b4fc; transform: scale(1.25); }

    /* ─── MODULE CONTENT BLOCK ─── */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .module-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }
    .module-card:hover {
      border-color: rgba(99,102,241,0.45);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(99,102,241,0.25);
    }
    .module-card-img {
      width: 100%; height: 140px;
      background: rgba(99,102,241,0.15);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .module-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .module-card-img.has-bg {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .module-card-tag {
      position: absolute; top: 10px; left: 10px;
      background: rgba(99,102,241,0.7); backdrop-filter: blur(6px);
      border-radius: 7px; padding: 3px 10px;
      font-size: 10px; font-weight: 600; color: #e0e7ff;
    }
    .module-card-body { padding: 18px 20px 20px; }
    .module-card-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .module-card-desc  { font-size: 12.5px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 14px; }
    .module-card-footer {
      display: flex; align-items: center; justify-content: space-between;
    }
    .module-card-meta { font-size: 11px; color: rgba(165,180,252,0.6); font-weight: 500; }
    .module-card-arrow {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #a5b4fc;
      transition: background 0.2s, transform 0.2s;
    }
    .module-card:hover .module-card-arrow {
      background: rgba(99,102,241,0.4); transform: translateX(3px);
    }

    /* ─── SIGN OUT MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: rgba(15, 15, 50, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 36px 40px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }

    .modal-icon { font-size: 40px; margin-bottom: 14px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .modal-msg { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 28px; }

    .modal-btns { display: flex; gap: 12px; justify-content: center; }

    .btn-cancel {
      padding: 10px 28px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.12); }

    .btn-signout {
      padding: 10px 28px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 13.5px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-signout:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-signout:active { transform: scale(0.97); }

    /* Responsive */
    @media (max-width: 700px) {
      nav { padding: 0 16px; }
      .nav-site-name { display: none; }
      .nav-links a, .nav-links button { padding: 8px 10px; font-size: 12px; }
      .welcome-section { padding: 40px 20px 28px; }
      .welcome-heading { font-size: 26px; }
      .content-area { padding: 28px 20px; }
    }

    /* ─── MOBILE (<=480px) ─── */
    @media (max-width: 480px) {
      nav { padding: 0 10px; }
      .nav-logo { width: 34px; height: 34px; }
      .nav-links { gap: 2px; }
      .nav-links a, .nav-links button { padding: 7px 9px; font-size: 11.5px; }
      .page { padding: 72px 14px 32px; }
      .welcome-section { padding: 32px 16px 24px; }
      .welcome-heading { font-size: 22px; }
      .content-area { padding: 22px 16px; }
      .modules-grid { grid-template-columns: 1fr; }
      .chat-window { left: 12px; right: 12px; width: auto; max-width: none; }
      .chat-bubble-btn { left: 16px; bottom: 20px; width: 52px; height: 52px; }
      .modal { width: 92%; }
    }

    /* ─── CHAT BUBBLE ─── */
    .chat-bubble-btn {
      position: fixed; bottom: 28px; left: 28px; z-index: 999;
      width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(99,102,241,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      font-size: 24px;
    }
    .chat-bubble-btn:hover { transform: scale(1.1); box-shadow: 0 10px 32px rgba(99,102,241,0.65); }
    .chat-bubble-btn .chat-badge {
      position: absolute; top: -3px; right: -3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ef4444; border: 2px solid #0a0a2e;
      font-size: 9px; font-weight: 700; color: #fff;
      display: none; align-items: center; justify-content: center;
    }
    .chat-bubble-btn .chat-badge.show { display: flex; }

    .chat-window {
      position: fixed; bottom: 98px; left: 28px; z-index: 998;
      width: 340px;
      max-width: calc(100vw - 56px);
      background: rgba(10,10,46,0.97);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: none; flex-direction: column;
      overflow: hidden; max-height: 460px;
    }
    .chat-window.open { display: flex; }

    .chat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.2));
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .chat-header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(99,102,241,0.4);
      border: 2px solid rgba(165,180,252,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-size: 13px; font-weight: 700; color: #fff; }
    .chat-header-status { font-size: 11px; color: rgba(165,180,252,0.7); display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #86efac; display: inline-block; }
    .chat-close-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.4); font-size: 18px;
      padding: 4px; line-height: 1; transition: color 0.2s;
    }
    .chat-close-btn:hover { color: #fff; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: thin; scrollbar-color: rgba(99,102,241,0.3) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

    .chat-msg {
      display: flex; flex-direction: column; gap: 3px;
      max-width: 85%;
    }
    .chat-msg.admin { align-self: flex-start; }
    .chat-msg.user  { align-self: flex-end; }

    .chat-msg-bubble {
      padding: 9px 13px; border-radius: 14px;
      font-size: 12.5px; line-height: 1.55;
    }
    .chat-msg.admin .chat-msg-bubble {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      border-bottom-left-radius: 4px;
    }
    .chat-msg.user .chat-msg-bubble {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg-time {
      font-size: 10px; color: rgba(255,255,255,0.25);
      padding: 0 4px;
    }
    .chat-msg.user .chat-msg-time { text-align: right; }

    .chat-typing {
      display: none; align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; border-bottom-left-radius: 4px;
      padding: 10px 14px; gap: 5px;
      align-items: center;
    }
    .chat-typing.show { display: flex; }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(165,180,252,0.6);
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .chat-input-row {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 9px 12px;
      color: #fff; font-size: 12.5px; font-family: 'Inter', sans-serif;
      resize: none; outline: none; line-height: 1.4;
      max-height: 90px; overflow-y: auto;
      transition: border-color 0.2s;
    }
    .chat-input::placeholder { color: rgba(255,255,255,0.25); }
    .chat-input:focus { border-color: rgba(99,102,241,0.5); }
    .chat-send-btn {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
      color: #fff;
    }
    .chat-send-btn:hover { opacity: 0.88; transform: scale(1.08); }
    .chat-send-btn:active { transform: scale(0.95); }

  /* ─── ACCESSIBILITY IMPROVEMENTS ─── */

    /* Skip to main content */
    .skip-link {
      position: fixed; top: -60px; left: 16px; z-index: 9999;
      background: #6366f1; color: #fff;
      padding: 12px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-decoration: none;
      transition: top 0.2s ease;
    }
    .skip-link:focus-visible { top: 12px; }

    /* Visible keyboard focus */
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #a5b4fc; outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
      }
    }

    /* ─── MOBILE HAMBURGER MENU ─── */
    .nav-toggle {
      display: none;
      flex-direction: column; justify-content: center; gap: 5px;
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; cursor: pointer; padding: 10px 9px;
    }
    .nav-toggle-bar {
      display: block; width: 100%; height: 2px;
      background: #fff; border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(2) { opacity: 0; }
    .nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 700px) {
      .nav-toggle { display: flex; }
      .nav-links {
        display: none;
        position: absolute; top: 68px; left: 0; right: 0;
        flex-direction: column; align-items: stretch;
        background: rgba(10,10,46,0.97);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 10px 16px 14px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      }
      .nav-links.open { display: flex; }
      .nav-links li { width: 100%; }
      .nav-links a, .nav-links button {
        width: 100%; justify-content: center;
        padding: 12px !important; font-size: 14px !important;
      }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- Background orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- ─── NAVIGATION BAR ─── -->
  <nav aria-label="Main navigation">
    <!-- Left: Logo + Site Name -->
    <a class="nav-brand" href="landing.html">
      <div class="nav-logo">
        <img src="images/logo.png" alt="AiTECH Logo" />
      </div>
      <span class="nav-site-name">AiOSH</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>

    // ─── MOBILE NAV TOGGLE ────────────────────────────────────
    (function initMobileNav() {
      const toggle = document.getElementById('nav-toggle');
      const menu = document.getElementById('nav-links');
      if (!toggle || !menu) return;
      const close = () => {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open menu');
      };
      toggle.addEventListener('click', () => {
        const open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      menu.querySelectorAll('a, button').forEach(el => el.addEventListener('click', close));
      document.addEventListener('click', (e) => {
        if (!document.querySelector('nav').contains(e.target)) close();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('open')) {
          close();
          toggle.focus();
        }
      });
    })();

    function getYearKey(yearStr) {
      if (!yearStr) return null;
      const y = yearStr.toLowerCase().trim();
      if (y.includes('1') || y.includes('first') || y.includes('1st')) return '1';
      if (y.includes('2') || y.includes('second') || y.includes('2nd')) return '2';
      return null;
    }

    function renderModuleCards(yearKey) {
      const grid = document.getElementById('modules-grid');
      grid.innerHTML = '';

      if (!yearKey || !moduleCards[yearKey]) {
        grid.innerHTML = `
          <div style="color:rgba(255,255,255,0.3);font-size:13px;padding:20px 0;">
            No module assigned. Please check your year level with your instructor.
          </div>`;
        return;
      }

      const mod = moduleCards[yearKey];

      const card = document.createElement('a');
      card.href      = 'course.html';
      card.className = 'module-card';
      card.innerHTML = `
        <div class="module-card-img has-bg" style="background-image:url('${mod.bg}')">
          <div class="module-card-tag">${mod.tag}</div>
        </div>
        <div class="module-card-body">
          <div class="module-card-title">${mod.title}</div>
          <div class="module-card-desc">${mod.desc}</div>
          <div class="module-card-footer">
            <span class="module-card-meta">${mod.meta}</span>
            <div class="module-card-arrow">→</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }

      const msg = input.toLowerCase()
        .replace(/[?!.,;:'"]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      let bestMatch = null;
      let bestScore = 0;

      for (const entry of KB) {
        let score = 0;
        for (const tag of entry.tags) {
          if (msg.includes(tag)) {
            // Longer tag match = higher score (more specific)
            score = Math.max(score, tag.length);
          }
        }
        if (score > bestScore) {
          bestScore = score;
          bestMatch = entry;
        }
      }

      if (bestMatch && bestScore >= 2) {
        return bestMatch.reply;
      }

      // Fallback responses
      const fallbacks = [
        "I'm not sure about that one! 😊 Could you rephrase your question? You can ask me about:\n\n• Login and account issues\n• Your module and videos\n• Tests and progress\n• Technical problems\n• Contact and support",
        "Hmm, I don't have a specific answer for that! 🤔 Try asking your question differently, or contact your AiTECH instructor for more specific concerns. 📞",
        "I couldn't find an answer for that! 😅 Please try rephrasing your question or use this chat to send your concern directly to the admin. Your message will be reviewed! 💬",
        "That's a bit outside what I know! 🤖 For specific or complex concerns, please contact your AiTECH instructor directly. I'm best at answering questions about the AiOSH portal! 😊"
      ];
      return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    // ── CHAT UI FUNCTIONS ─────────────────────────────────────
    let chatOpened    = false;
    let greetingShown = false;

    function toggleChat() {
      const win = document.getElementById('chat-window');
      chatOpened = !chatOpened;
      win.classList.toggle('open', chatOpened);
      document.querySelectorAll('.chat-bubble-btn, .chat-close-btn').forEach(b => {
        b.setAttribute('aria-expanded', chatOpened ? 'true' : 'false');
      });
      if (chatOpened && !greetingShown) {
        greetingShown = true;
        showGreeting();
      }
      if (chatOpened) {
        hideBadge();
        setTimeout(() => {
          const msgs = document.getElementById('chat-messages');
          msgs.scrollTop = msgs.scrollHeight;
        }, 100);
      }
    }

    function showGreeting() {
      const name = sessionStorage.getItem('aiosh_session_name')
                || localStorage.getItem('aiosh_name')
                || 'there';
      showTyping();
      setTimeout(() => {
        hideTyping();
        appendAdminMsg('Hi, ' + name + '! 👋 I am the AiOSH Virtual Assistant. I can answer questions about the portal, your modules, videos, tests, progress, and more!');
        showTyping();
        setTimeout(() => {
          hideTyping();
          appendAdminMsg('If you need help, just type your question below and I will do my best to assist you. 😊');
        }, 900 + Math.random() * 300);
      }, 900 + Math.random() * 300);
    }

    function showTyping() {
      document.getElementById('chat-typing').classList.add('show');
      scrollChat();
    }
    function hideTyping() {
      document.getElementById('chat-typing').classList.remove('show');
    }
    function scrollChat() {
      const msgs = document.getElementById('chat-messages');
      setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
    }
    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function appendAdminMsg(text) {
      const msgs = document.getElementById('chat-messages');
      const div  = document.createElement('div');
      div.className = 'chat-msg admin';
      div.innerHTML = '<div class="chat-msg-bubble">' + text.replace(/\n/g,'<br>') + '</div><div class="chat-msg-time">' + getTime() + '</div>';
      msgs.appendChild(div);
      scrollChat();
    }
    function appendUserMsg(text) {
      const msgs = document.getElementById('chat-messages');
      const div  = document.createElement('div');
      div.className = 'chat-msg user';
      div.innerHTML = '<div class="chat-msg-bubble">' + text + '</div><div class="chat-msg-time">' + getTime() + '</div>';
      msgs.appendChild(div);
      scrollChat();
    }
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text  = input.value.trim();
      if (!text) return;

      appendUserMsg(text);
      input.value = '';
      input.style.height = 'auto';

      // Save to localStorage for admin
      const name = sessionStorage.getItem('aiosh_session_name') || localStorage.getItem('aiosh_name') || 'Student';
      const year = sessionStorage.getItem('aiosh_session_year') || localStorage.getItem('aiosh_year') || '-';
      const id   = sessionStorage.getItem('aiosh_session_id')   || localStorage.getItem('aiosh_id')   || '-';
      const existing = JSON.parse(localStorage.getItem('aiosh_messages') || '[]');
      existing.push({ name, year, id, message: text, timestamp: new Date().toISOString(), read: false });
      localStorage.setItem('aiosh_messages', JSON.stringify(existing));

      // Simulate typing delay then reply
      showTyping();
      setTimeout(() => {
        hideTyping();
        const reply = getBotReply(text);
        appendAdminMsg(reply);
      }, 800 + Math.random() * 500);
    }
    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 90) + 'px';
    }
    function hideBadge() {
      document.getElementById('chat-badge').classList.remove('show');
    }


  </script>

  <!-- ─── CHAT BUBBLE ─── -->
  <button class="chat-bubble-btn" onclick="toggleChat()" title="Send a concern" aria-label="Open chat support" aria-expanded="false">
    💬
    <div class="chat-badge" id="chat-badge"></div>
  </button>

  <div class="chat-window" id="chat-window" role="dialog" aria-label="Chat support">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-avatar">🎓</div>
      <div class="chat-header-info">
        <div class="chat-header-name">AiOSH Support</div>
        <div class="chat-header-status"><span class="status-dot"></span> Admin is available</div>
      </div>
      <button class="chat-close-btn" onclick="toggleChat()" aria-label="Close chat support" aria-expanded="false">✕</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages">
      <!-- Populated by JS -->
    </div>
    <div class="chat-typing" id="chat-typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <!-- Input -->
    <div class="chat-input-row">
      <textarea
        class="chat-input" id="chat-input"
        placeholder="Type your concern here…"
        rows="1"
        onkeydown="handleChatKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="chat-send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</body>
</html>
